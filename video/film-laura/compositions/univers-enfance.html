      <script>
        (function () {
          const ID = "enfance";
          const DUR = 101;
          const BG_SWITCHES = [29, 58, 87]; // début du fondu (1 s) vers le fond suivant
          const TITLE_OUT = 2.4; // le titre se range dans l'étiquette du coin
          const FIRST_SLOT_IN = 2.0;
          const DATE_IN = 1.2;
          const DATE_OUT = 7.6; // repère « Juillet 2009 » (TXT_DATE_NAISSANCE de timeline.json)
          const IN_S = 1.2;
          const KB_SCALE = 1.1;

          // Générateur pseudo-aléatoire à graine fixe : rendu déterministe.
          function mulberry32(seed) {
            let a = seed >>> 0;
            return () => {
              a = (a + 0x6d2b79f5) | 0;
              let t = Math.imul(a ^ (a >>> 15), 1 | a);
              t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
              return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
          }
          const rand = mulberry32(2009);

          // Bulles décoratives de la transition « bulles de savon » (créées une fois, positions fixes).
          const bubbleHost = document.getElementById("enf-bubbles");
          const BUBBLES = Array.from({ length: 10 }, () => {
            const b = document.createElement("div");
            b.className = "enf-bubble";
            const size = 60 + Math.round(rand() * 110);
            b.style.width = b.style.height = size + "px";
            b.style.left = Math.round(260 + rand() * 1300) + "px";
            b.style.top = Math.round(700 + rand() * 260) + "px";
            bubbleHost.appendChild(b);
            return b;
          });

          function enter(tl, slot, style, at, tilt) {
            if (style === "page_tournee_pastel") {
              tl.fromTo(slot, { opacity: 0, rotationY: -75, rotation: tilt, transformOrigin: "0% 50%", x: -120 }, { opacity: 1, rotationY: 0, x: 0, duration: IN_S, ease: "power3.out" }, at);
            } else if (style === "bulles_de_savon") {
              tl.fromTo(slot, { opacity: 0, scale: 0.55, rotation: tilt * 2, y: 120 }, { opacity: 1, scale: 1, rotation: tilt, y: 0, duration: IN_S, ease: "back.out(1.5)" }, at);
              BUBBLES.forEach((b, k) => {
                tl.fromTo(b, { opacity: 0, y: 0, scale: 0.6 }, { opacity: 0.9, y: -260 - k * 30, scale: 1, duration: 1.4, ease: "sine.out", immediateRender: false }, at - 0.2 + k * 0.04);
                tl.to(b, { opacity: 0, duration: 0.4 }, at + 1.2 + k * 0.04);
              });
            } else if (style === "etoiles_scintillantes") {
              tl.fromTo(slot, { opacity: 0, scale: 0.9, rotation: tilt * 3, filter: "brightness(1.6)" }, { opacity: 1, scale: 1, rotation: tilt, filter: "brightness(1)", duration: IN_S, ease: "power2.out" }, at);
            } else {
              // fondu enchaîné doux / aquarelle
              tl.fromTo(slot, { opacity: 0, scale: 1.05, rotation: tilt, filter: "blur(16px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: IN_S + 0.3, ease: "sine.out" }, at);
            }
          }

          function build() {
            const tl = gsap.timeline({ paused: true });
            const slots = Array.from(document.querySelectorAll("#enfance .slot"));
            document.getElementById("enf-count-total").textContent = String(slots.length).padStart(2, "0");

            // ---------------------------------------------------------------- fonds
            ["#enf-bg-2", "#enf-bg-3", "#enf-bg-4"].forEach((sel, i) => {
              tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 1, ease: "sine.inOut" }, BG_SWITCHES[i]);
            });

            // ---------------------------------------------------------------- titre d'univers
            tl.fromTo("#enf-title-num", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, 0.2);
            tl.fromTo("#enf-title-main", { y: 60, opacity: 0, filter: "blur(14px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 1.1, ease: "power3.out" }, 0.35);
            tl.to("#enf-title", { opacity: 0, y: -40, scale: 0.92, duration: 0.7, ease: "power2.in" }, TITLE_OUT);
            tl.fromTo("#enf-tag", { x: -30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, TITLE_OUT + 0.5);
            tl.fromTo("#enf-count", { x: 30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, TITLE_OUT + 0.5);
            tl.to(["#enf-tag", "#enf-count"], { opacity: 0, duration: 0.5 }, DUR - 0.6);
            tl.fromTo("#enf-date", { opacity: 0, rotation: -10, scale: 0.8 }, { opacity: 1, rotation: -5, scale: 1, duration: 0.9, ease: "back.out(1.6)" }, DATE_IN);
            tl.to("#enf-date", { opacity: 0, y: 20, duration: 0.6 }, DATE_OUT);

            // ---------------------------------------------------------------- photos : entrée, Ken Burns, sortie
            const counter = document.getElementById("enf-count-n");
            slots.forEach((slot, i) => {
              const at = Math.max(Number(slot.dataset.at), i === 0 ? FIRST_SLOT_IN : 0);
              const next = slots[i + 1];
              const out = next ? Number(next.dataset.at) : DUR - 0.6;
              const tilt = i % 2 ? 1.6 : -1.6;
              const kb = slot.querySelector(".m-kb");

              enter(tl, slot, slot.dataset.tr || "fondu_enchaine_doux", at, tilt);
              tl.fromTo(kb, { scale: 1, xPercent: 0 }, { scale: KB_SCALE, xPercent: i % 2 ? 2 : -2, duration: out - at + 1, ease: "none" }, at);
              tl.to(slot, { opacity: 0, y: -30, scale: 0.97, duration: 0.9, ease: "sine.in" }, out - 0.1);
              tl.set(counter, { textContent: String(i + 1).padStart(2, "0") }, at);
            });

            window.__timelines[ID] = tl;
          }

          document.fonts.ready.then(build);
        })();
      </script>
    </template>
  </body>
</html>
