          <div class="op-card enfance" data-layout-ignore data-tx="690" data-ty="70" data-rot="5" data-scale="0.94"><div class="op-pic"><div class="op-ph"><b>04</b><span>PHOTO À VENIR</span></div></div><span class="op-cap">ENFANCE</span></div>
          <div class="op-card betises" data-layout-ignore data-tx="-620" data-ty="380" data-rot="-5" data-scale="0.9"><div class="op-pic"><div class="op-ph"><b>04</b><span>PHOTO À VENIR</span></div></div><span class="op-cap">EN VRILLE</span></div>
          <div class="op-card enfance" data-layout-ignore data-tx="-220" data-ty="390" data-rot="8" data-scale="0.88"><div class="op-pic"><div class="op-ph"><b>05</b><span>PHOTO À VENIR</span></div></div><span class="op-cap">ENFANCE</span></div>
          <div class="op-card ado" data-layout-ignore data-tx="170" data-ty="380" data-rot="-2" data-scale="0.92"><div class="op-pic"><div class="op-ph"><b>04</b><span>PHOTO À VENIR</span></div></div><span class="op-cap">ADOLESCENCE</span></div>
          <div class="op-card enfance" data-layout-ignore data-tx="560" data-ty="400" data-rot="-8" data-scale="0.9"><div class="op-pic"><div class="op-ph"><b>06</b><span>PHOTO À VENIR</span></div></div><span class="op-cap">ENFANCE</span></div>

        </div>
        <div data-hf-id="hf-as8b" id="op-dim" data-layout-allow-occlusion=""></div>

        <div data-hf-id="hf-i73x" id="op-title">
          <div data-hf-id="hf-cir3" id="op-title-l1"><span data-hf-id="hf-kqix" class="w">Et</span><span data-hf-id="hf-anyj" class="w">puis</span><span data-hf-id="hf-fxdp" class="w">il</span><span data-hf-id="hf-kqmr" class="w">y</span><span data-hf-id="hf-b7a3" class="w">a</span></div>
          <div data-hf-id="hf-3uv8" id="op-title-l2">
            <span data-hf-id="hf-tqcl" class="w" id="op-title-laura">Laura,</span>
            <span data-hf-id="hf-fdqz" class="w" id="op-title-quoi">quoi<span data-hf-id="hf-jads" class="op-dot">.</span><span data-hf-id="hf-4ppk" class="op-dot">.</span><span data-hf-id="hf-3ish" class="op-dot">.</span></span>
          </div>
          <div data-hf-id="hf-mwco" id="op-title-meta">18 ANS · LES ARCHIVES</div>
        </div>

        <div data-hf-id="hf-8bm1" id="op-fade" data-layout-allow-occlusion=""></div>
      </div>

      <script>
        (function () {
          const ID = "opening";
          const W = 1920;
          const H = 1080;

          // ---------------------------------------------------------------- repères (s, temps local = temps du film)
          const T = {
            phoneIn: 0.15,
            typingStart: 33.0,
            final: 34.0,
            vibrate: 35.6, // = fin de la nappe de tension : la suspension commence ici
            zoomStart: 37.0,
            whooshPeak: 39.8,
            impact: 39.85,
            titleIn: 41.7,
            fadeOut: 44.7,
            end: 45.4,
          };
          const VIBRATION_BURSTS = [0, 0.62]; // calé sur SFX_WA_VIBRE (2 salves de 0,42 s)
          const BUZZ_S = 0.42;
          const SHAKE_STEP_S = 0.03;
          const TYPING_ROOM_PX = 52; // bulle « écrit… » (44 px) + espacement
          const CHAT_SCALE = 1.25; // en-tête encore visible, texte ≈ 26 px à l'écran
          const CHAT_SCALE_PEAK = 1.36;
          const CHAT_SHIFT_Y = -44; // bas du téléphone ≈ 520 px sous le centre à ×1,25

          // Variables (prénom de l'ami·e, heure) : lues une fois.
          const vars = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : {};
          const friend = String(vars.friendName || "Sam").trim() || "Sam";
          document.getElementById("op-name").textContent = friend;
          document.getElementById("op-avatar").textContent = friend.charAt(0).toUpperCase();
          if (vars.clock) document.getElementById("op-clock").textContent = vars.clock;

          function build() {
            const root = document.getElementById(ID);
            const thread = document.getElementById("op-thread");
            const msgs = Array.from(thread.querySelectorAll(".op-msg"));
            const finalEl = document.getElementById("op-final");

            // Mesures une seule fois, avant toute transformation GSAP.
            // offsetFor(el) = translation verticale du fil pour que `el` soit le dernier message visible.
            const threadH = thread.offsetHeight;
            const bottomPad = 14;
            const offsetFor = (el) => threadH - bottomPad - (el.offsetTop + el.offsetHeight);
            const typingOffset = offsetFor(msgs[msgs.length - 2]) - TYPING_ROOM_PX;

            // Centre de la dernière bulle par rapport au centre de l'image (pour le zoom).
            const rootRect = root.getBoundingClientRect();
            const k = rootRect.width / W || 1;
            const fr = finalEl.getBoundingClientRect();
            const targetX = (fr.left - rootRect.left + fr.width / 2) / k - W / 2;
            const targetY = (fr.top - rootRect.top + fr.height / 2) / k - H / 2;

            const tl = gsap.timeline({ paused: true });

            // ---------------------------------------------------------------- 1. apparition du téléphone
            tl.fromTo("#op-phone-wrap", { y: 520, rotation: -4, opacity: 0 }, { y: 0, rotation: 0, opacity: 1, duration: 1.3, ease: "expo.out" }, T.phoneIn);
            tl.fromTo("#op-glow", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 2.4, ease: "power2.out" }, 0);

            // ---------------------------------------------------------------- 2. la conversation
            tl.set(thread, { y: offsetFor(msgs[0]) + 140 }, 0);
            tl.to(".op-day", { opacity: 0, duration: 0.3 }, 12.0);
            msgs.forEach((el) => {
              const at = Number(el.dataset.at);
              const isFinal = el === finalEl;
              tl.fromTo(
                el,
                { opacity: 0, scale: 0.55 },
                { opacity: 1, scale: 1, duration: isFinal ? 0.45 : 0.3, ease: isFinal ? "back.out(2.2)" : "back.out(1.7)" },
                at,
              );
              tl.to(thread, { y: offsetFor(el), duration: 0.32, ease: "power2.out" }, at);
            });

            // Les bulles sorties par le haut du fil (sous l'en-tête) sont retirées une fois cachées.
            const chatH = document.getElementById("op-chat").clientHeight;
            const threadTop = chatH - threadH;
            const scrolls = msgs.map((el) => [Number(el.dataset.at), offsetFor(el)]);
            scrolls.push([T.typingStart, typingOffset]);
            const hidden = new Set();
            scrolls.forEach(([at, y]) => {
              msgs.forEach((el) => {
                const bottom = threadTop + el.offsetTop + el.offsetHeight + y;
                if (!hidden.has(el) && Number(el.dataset.at) < at && bottom <= 0) {
                  hidden.add(el);
                  tl.set(el, { opacity: 0 }, at + 0.32);
                }
              });
            });

            // « écrit… » : en-tête + bulle animée ; le dernier message la remplace.
            tl.to(thread, { y: typingOffset, duration: 0.3, ease: "power2.out" }, T.typingStart);
            tl.fromTo("#op-typing", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, T.typingStart);
            tl.to("#op-typing", { opacity: 0, scale: 0.6, duration: 0.12 }, T.final - 0.08);
            tl.fromTo("#op-state-typing", { opacity: 0 }, { opacity: 1, duration: 0.15 }, T.typingStart);
            tl.fromTo("#op-state-online", { opacity: 1 }, { opacity: 0, duration: 0.15 }, T.typingStart);
            tl.to("#op-state-typing", { opacity: 0, duration: 0.15 }, T.final);
            tl.to("#op-state-online", { opacity: 1, duration: 0.15 }, T.final);
            const typingCycles = Math.floor((T.final - T.typingStart) / 0.6);
            document.querySelectorAll("#op-typing i").forEach((dot, i) => {
              tl.fromTo(
                dot,
                { y: 0, opacity: 0.45 },
                { y: -7, opacity: 1, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: typingCycles * 2 - 1 },
                T.typingStart + i * 0.14,
              );
            });

            // ---------------------------------------------------------------- 3. montée dramatique : la caméra se rapproche
            // Cadrage serré sur le bas du fil (lisibilité en projection), puis lente poussée jusqu'à la vibration.
            tl.fromTo("#op-cam", { scale: 1 }, { scale: CHAT_SCALE, duration: 1.3, ease: "power2.inOut" }, 1.3);
            tl.fromTo("#op-cam-in", { y: 0 }, { y: CHAT_SHIFT_Y, duration: 1.3, ease: "power2.inOut" }, 1.3);
            tl.to("#op-cam", { scale: CHAT_SCALE_PEAK, duration: T.vibrate - 2.6, ease: "power1.in" }, 2.6);
            tl.fromTo("#op-vignette", { opacity: 0.55 }, { opacity: 1, duration: T.vibrate - 1, ease: "power1.in" }, 1);
            tl.to("#op-glow", { opacity: 0.35, duration: 3, ease: "power1.inOut" }, 9);
            tl.fromTo(
              finalEl,
              { boxShadow: "0 1px 1px rgba(17,27,33,0.12)" },
              { boxShadow: "0 0 0 3px rgba(255,210,122,0.9), 0 10px 30px rgba(255,210,122,0.45)", duration: 0.6, immediateRender: false },
              T.final + 0.3,
            );

            // ---------------------------------------------------------------- 4. vibration, puis suspension
            const shakeSteps = Math.floor(BUZZ_S / SHAKE_STEP_S);
            VIBRATION_BURSTS.forEach((offset) => {
              tl.fromTo(
                "#op-phone-wrap",
                { x: -7, rotation: -1.4 },
                { x: 7, rotation: 1.4, duration: SHAKE_STEP_S, ease: "none", yoyo: true, repeat: shakeSteps - 1, immediateRender: false },
                T.vibrate + offset,
              );
              tl.to("#op-phone-wrap", { x: 0, rotation: 0, duration: 0.05 }, T.vibrate + offset + BUZZ_S);
            });

            // ---------------------------------------------------------------- 5. zoom cinématographique dans la dernière bulle
            tl.to("#op-cam-in", { x: -targetX, y: -targetY, duration: 1.5, ease: "power2.inOut", immediateRender: false }, T.zoomStart);
            tl.to("#op-cam", { scale: 4.4, duration: 2.0, ease: "power2.in" }, T.zoomStart);
            tl.to("#op-cam", { scale: 18, duration: 0.8, ease: "power3.in" }, T.zoomStart + 2.0);
            tl.fromTo("#op-cam", { filter: "blur(0px)" }, { filter: "blur(16px)", duration: 0.55, ease: "power2.in", immediateRender: false }, T.whooshPeak - 0.55);
            tl.to("#op-glow", { opacity: 0, duration: 0.8 }, T.zoomStart + 1.2);

            // ---------------------------------------------------------------- 6. whoosh → éclair → impact
            tl.fromTo("#op-flash", { opacity: 0 }, { opacity: 1, duration: 0.28, ease: "power2.in" }, T.whooshPeak - 0.25);
            tl.set("#op-cam", { opacity: 0 }, T.impact);
            tl.set("#op-vignette", { opacity: 0.6 }, T.impact);
            tl.to("#op-flash", { opacity: 0, duration: 0.6, ease: "power2.out" }, T.impact + 0.05);

            // ---------------------------------------------------------------- 7. expansion des photographies (center-outward-expansion)
            document.querySelectorAll("#op-burst .op-card").forEach((card, i) => {
              tl.fromTo(
                card,
                { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 0.15, rotation: 0, opacity: 0 },
                {
                  x: Number(card.dataset.tx),
                  y: Number(card.dataset.ty),
                  rotation: Number(card.dataset.rot),
                  scale: Number(card.dataset.scale),
                  opacity: 1,
                  duration: 1.35,
                  ease: "expo.out",
                },
                T.impact + 0.02 + i * 0.035,
              );
            });
            tl.fromTo("#op-burst", { scale: 1 }, { scale: 1.09, duration: T.end - T.impact, ease: "none" }, T.impact);

            // ---------------------------------------------------------------- 8. titre
            tl.fromTo("#op-dim", { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "power2.inOut" }, T.titleIn - 0.5);
            tl.fromTo("#op-title-l1 .w", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out", stagger: 0.08 }, T.titleIn);
            tl.fromTo(
              "#op-title-laura",
              { scale: 1.35, opacity: 0, filter: "blur(10px)" },
              { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.7, ease: "expo.out" },
              T.titleIn + 0.55,
            );
            tl.fromTo("#op-title-quoi", { x: 40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, T.titleIn + 1.0);
            document.querySelectorAll("#op-title .op-dot").forEach((dot, i) => {
              tl.fromTo(dot, { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: 0.25, ease: "back.out(3)" }, T.titleIn + 1.35 + i * 0.2);
            });
            tl.fromTo(
              "#op-title-meta",
              { opacity: 0, y: 24 },
              { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" },
              T.titleIn + 1.9,
            );

            // ---------------------------------------------------------------- 9. vers l'univers 01 (fond crème)
            tl.fromTo("#op-title", { scale: 1, opacity: 1 }, { scale: 1.06, opacity: 0, duration: 0.7, ease: "power2.in" }, T.fadeOut);
            tl.fromTo("#op-fade", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power2.inOut" }, T.fadeOut);

            window.__timelines[ID] = tl;
          }

          document.fonts.ready.then(build);
        })();
      </script>
    </template>
