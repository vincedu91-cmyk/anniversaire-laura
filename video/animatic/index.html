<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Animatique — Laura, 18 ans</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Caveat:wght@500;700&family=Geist+Mono:wght@400;600&display=swap"
    />
    <style>
      :root {
        --encre: #0d0d11;
        --fond: #e7e8eb;
        --muted: #8a8b93;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--encre);
        color: var(--fond);
        font: 14px/1.4 "Geist Mono", ui-monospace, monospace;
        display: flex;
        flex-direction: column;
      }
      #stage {
        position: relative;
        flex: 1;
        display: grid;
        place-items: center;
        padding: 12px;
        min-height: 0;
      }
      #screen {
        width: min(100%, calc((100vh - 150px) * 16 / 9));
        aspect-ratio: 16 / 9;
        background: #000;
        box-shadow: 0 0 0 1px #2a2a33;
      }
      #stage:fullscreen #screen {
        width: min(100vw, 100vh * 16 / 9);
      }
      #hud {
        position: absolute;
        top: 20px;
        left: 20px;
        max-width: 46ch;
        padding: 10px 12px;
        background: rgba(13, 13, 17, 0.72);
        color: var(--fond);
        font-size: 12px;
        pointer-events: none;
      }
      .hud-title {
        font-weight: 600;
        color: #ffd27a;
      }
      #error {
        position: absolute;
        inset: 30% 10% auto;
        padding: 20px;
        background: #3b3042;
        color: #f5f1f2;
      }
      #controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 16px;
        align-items: center;
        padding: 10px 16px 14px;
        border-top: 1px solid #2a2a33;
      }
      #timeline {
        position: relative;
        flex: 1 1 100%;
      }
      #scrub {
        width: 100%;
        accent-color: #ffd27a;
      }
      #marks span {
        position: absolute;
        top: -4px;
        width: 2px;
        height: 8px;
        background: #ffd27a;
        pointer-events: none;
      }
      button,
      select {
        font: inherit;
        color: var(--fond);
        background: #1c1c24;
        border: 1px solid #34343f;
        padding: 5px 10px;
        cursor: pointer;
      }
      button:hover {
        border-color: #ffd27a;
      }
      button:focus-visible,
      select:focus-visible,
      input:focus-visible {
        outline: 2px solid #ffd27a;
        outline-offset: 2px;
      }
      #sections {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      label {
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      .muted {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main id="stage" aria-label="Animatique de la vidéo">
      <canvas id="screen" width="1920" height="1080" aria-label="Rendu de la vidéo"></canvas>
      <div id="hud" hidden></div>
      <div id="error" role="alert" hidden></div>
    </main>
    <div id="controls">
      <div id="timeline">
        <input id="scrub" type="range" min="0" max="360" value="0" aria-label="Position dans la vidéo" />
        <div id="marks"></div>
      </div>
      <button id="play" type="button">▶ Lecture</button>
      <span id="time">00:00:00 / 06:00:00</span>
      <label>Vitesse
        <select id="speed">
          <option value="0.5">0,5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
        </select>
      </label>
      <nav id="sections" aria-label="Sections"></nav>
      <label><input id="opt-hud" type="checkbox" checked /> HUD</label>
      <label><input id="opt-sound" type="checkbox" checked /> Son (musiques, voix + SFX, à 1×)</label>
      <button id="fullscreen" type="button">Plein écran</button>
      <span class="muted">Espace · ←/→ (±1 s, Maj ±10 s) · ,/. image · 1–5 sections · H · M (son) · F</span>
      <span id="tiles" class="muted"></span>
    </div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
