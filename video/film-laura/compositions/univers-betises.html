      <script>
        (function () {
          const ID = "betises";
          const DUR = 105;
          const TITLE_OUT = 2.4;
          const FIRST_SLOT_IN = 2.2;
          const PILE_KEEP = 5; // tirages encore visibles sous le dernier
          const CLASSE_AT = 102.0; // SFX_CLO_TADAA
          const OUT_AT = 104.2; // vers le final (noir chaud)
          const CONFETTI_COLORS = ["#ffd400", "#e5202e", "#17b857", "#1f4fe0"];

          function mulberry32(seed) {
            let a = seed >>> 0;
            return () => {
              a = (a + 0x6d2b79f5) | 0;
              let t = Math.imul(a ^ (a >>> 15), 1 | a);
              t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
              return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
          }
          const rand = mulberry32(1818);

          // Confettis réutilisés à chaque « confettis_burst » (trajectoires fixées une fois).
          const confettiHost = document.getElementById("bet-confetti");
          const CONFETTI = Array.from({ length: 18 }, (_, k) => {
            const c = document.createElement("div");
            c.className = "bet-confetto";
            c.style.background = CONFETTI_COLORS[k % CONFETTI_COLORS.length];
            confettiHost.appendChild(c);
            const angle = (k / 18) * Math.PI * 2 + rand() * 0.3;
            const dist = 420 + rand() * 360;
            return { el: c, x: Math.cos(angle) * dist, y: Math.sin(angle) * dist * 0.7, r: (rand() - 0.5) * 720 };
          });

          function enter(tl, slot, style, at, pose) {
            const land = { opacity: 1, x: pose.x, y: pose.y, rotation: pose.r, scale: 1 };
            const media = slot.querySelector(".slot-media");
            switch (style) {
              case "iris_cercle_cartoon":
                tl.fromTo(slot, { opacity: 0, x: pose.x, y: pose.y, rotation: pose.r, scale: 1, clipPath: "circle(0% at 50% 50%)" }, { ...land, clipPath: "circle(80% at 50% 50%)", duration: 0.55, ease: "power3.out" }, at);
                break;
              case "tarte_a_la_creme_splat":
                tl.fromTo(slot, { opacity: 0, x: pose.x, y: -900, rotation: pose.r * 3, scale: 1 }, { ...land, duration: 0.55, ease: "back.out(1.3)" }, at);
                tl.fromTo(media, { scaleY: 0.82, scaleX: 1.12 }, { scaleY: 1, scaleX: 1, duration: 0.35, ease: "elastic.out(1, 0.4)", immediateRender: false }, at + 0.45);
                break;
              case "etoile_wipe":
                tl.fromTo(slot, { opacity: 0, x: pose.x, y: pose.y, rotation: pose.r - 200, scale: 0 }, { ...land, duration: 0.6, ease: "back.out(1.6)" }, at);
                break;
              case "squash_stretch":
                tl.fromTo(slot, { opacity: 0, x: pose.x, y: pose.y, rotation: pose.r, scale: 1 }, { ...land, duration: 0.15 }, at);
                tl.fromTo(media, { scaleX: 1.45, scaleY: 0.55 }, { scaleX: 1, scaleY: 1, duration: 0.7, ease: "elastic.out(1, 0.35)", immediateRender: false }, at);
                break;
              case "explosion_bulle_bd":
                tl.fromTo("#bet-burst", { opacity: 1, scale: 0, rotation: 0 }, { scale: 1.15, rotation: 25, duration: 0.3, ease: "back.out(2)", immediateRender: false }, at);
                tl.to("#bet-burst", { opacity: 0, scale: 1.4, duration: 0.3, ease: "power2.in" }, at + 0.55);
                tl.fromTo(slot, { opacity: 0, x: pose.x, y: pose.y, rotation: pose.r, scale: 0.3 }, { ...land, duration: 0.45, ease: "back.out(2.2)" }, at + 0.1);
                break;
              default: // confettis_burst : le tirage claque sur le bureau
                tl.fromTo(slot, { opacity: 0, x: pose.x, y: pose.y, rotation: pose.r, scale: 1.45 }, { ...land, duration: 0.4, ease: "power4.in" }, at);
                CONFETTI.forEach((c) => {
                  tl.fromTo(c.el, { opacity: 1, x: 0, y: 0, rotation: 0 }, { x: c.x, y: c.y, rotation: c.r, duration: 1.1, ease: "power3.out", immediateRender: false }, at + 0.35);
                  tl.to(c.el, { opacity: 0, duration: 0.3 }, at + 1.2);
                });
            }
          }

          function decorate(slot, i) {
            const media = slot.querySelector(".slot-media");
            const label = document.createElement("div");
            label.className = "bet-label";
            label.setAttribute("data-layout-allow-overlap", ""); // la pile se chevauche volontairement
            label.textContent = "Pièce n° " + String(i + 1).padStart(2, "0");
            media.appendChild(label);
            const stamp = document.createElement("div");
            stamp.className = "bet-stamp";
            stamp.setAttribute("data-layout-allow-overlap", "");
            stamp.textContent = i % 3 === 2 ? "CONFIRMÉ" : "PREUVE";
            media.appendChild(stamp);
            let bubble = null;
            if (slot.dataset.text) {
              bubble = document.createElement("div");
              bubble.className = "bet-bubble";
              bubble.setAttribute("data-layout-allow-overlap", "");
              bubble.textContent = slot.dataset.text;
              media.appendChild(bubble);
            }
            return { media, stamp, bubble };
          }

          function build() {
            const tl = gsap.timeline({ paused: true });
            const slots = Array.from(document.querySelectorAll("#betises .slot"));
            document.getElementById("bet-count-total").textContent = String(slots.length).padStart(2, "0");

            // ---------------------------------------------------------------- titre + en-tête du dossier
            tl.fromTo("#bet-title-num", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.1);
            tl.fromTo("#bet-title-main", { opacity: 0, scale: 0.2, rotation: -12 }, { opacity: 1, scale: 1, rotation: -4, duration: 0.6, ease: "back.out(2.4)" }, 0.2);
            tl.to("#bet-title", { opacity: 0, y: -80, duration: 0.35, ease: "power2.in" }, TITLE_OUT);
            tl.fromTo("#bet-confid", { opacity: 0, scale: 2.2, rotation: 0 }, { opacity: 1, scale: 1, rotation: 6, duration: 0.25, ease: "power4.in" }, 1.6);
            tl.fromTo("#bet-count", { opacity: 0 }, { opacity: 1, duration: 0.3 }, TITLE_OUT + 0.4);
            tl.fromTo("#bet-desk", { scale: 1.04 }, { scale: 0.94, duration: DUR, ease: "none" }, 0);

            // ---------------------------------------------------------------- les pièces à conviction s'empilent
            const counter = document.getElementById("bet-count-n");
            slots.forEach((slot, i) => {
              const at = Math.max(Number(slot.dataset.at), i === 0 ? FIRST_SLOT_IN : 0);
              const next = slots[i + 1];
              const out = next ? Number(next.dataset.at) : DUR;
              const chaos = 0.25 + (0.75 * i) / Math.max(1, slots.length - 1); // l'empilement devient incontrôlable
              const pose = {
                x: Math.round((rand() - 0.5) * 760 * chaos),
                y: Math.round((rand() - 0.5) * 300 * chaos),
                r: Math.round((rand() - 0.5) * 26 * chaos * 10) / 10,
              };
              const { media, stamp, bubble } = decorate(slot, i);
              tl.set(counter, { textContent: String(i + 1).padStart(2, "0") }, at);

              enter(tl, slot, slot.dataset.tr || "confettis_burst", at, pose);
              tl.fromTo(stamp, { opacity: 0, scale: 2.4, rotation: -30 }, { opacity: 1, scale: 1, rotation: -14, duration: 0.18, ease: "power4.in" }, at + 0.7);
              if (bubble) {
                tl.fromTo(bubble, { opacity: 0, scale: 0.2, rotation: -20 }, { opacity: 1, scale: 1, rotation: -6, duration: 0.3, ease: "back.out(2.5)" }, at + 0.6);
                tl.to(bubble, { opacity: 0, scale: 0.8, duration: 0.2 }, at + 2.2);
              }

              // ralenti comique : poussée lente puis image figée qui tremble
              const kb = slot.querySelector(".m-kb");
              if (slot.dataset.freeze) {
                tl.fromTo(kb, { scale: 1 }, { scale: 1.18, duration: out - at - 1.2, ease: "power1.inOut" }, at);
                tl.fromTo(media, { x: -3 }, { x: 3, duration: 0.04, yoyo: true, repeat: 23, ease: "none", immediateRender: false }, out - 1.1);
              } else {
                tl.fromTo(kb, { scale: 1 }, { scale: 1.06, duration: out - at, ease: "none" }, at);
              }

              // la pile : les anciens tirages pâlissent, les plus vieux disparaissent
              if (next) tl.to(slot, { filter: "brightness(0.9)", duration: 0.3 }, out);
              const gone = slots[i + PILE_KEEP];
              if (gone) tl.to(slot, { opacity: 0, duration: 0.4 }, Number(gone.dataset.at));
            });

            // ---------------------------------------------------------------- dossier classé, puis vers le final
            tl.fromTo("#bet-classe", { opacity: 0, scale: 3, rotation: 0 }, { opacity: 1, scale: 1, rotation: -8, duration: 0.22, ease: "power4.in" }, CLASSE_AT);
            tl.fromTo("#bet-desk", { x: 0 }, { x: 10, duration: 0.05, yoyo: true, repeat: 5, ease: "none", immediateRender: false }, CLASSE_AT + 0.22);
            tl.to("#bet-count", { opacity: 0, duration: 0.3 }, CLASSE_AT);
            tl.fromTo("#bet-out", { opacity: 0 }, { opacity: 1, duration: DUR - OUT_AT, ease: "power2.in" }, OUT_AT);

            window.__timelines[ID] = tl;
          }

          document.fonts.ready.then(build);
        })();
      </script>
    </template>
  </body>
</html>
