      <script>
        (function () {
          const ID = "ado";
          const DUR = 105;
          const BEAT = 60 / 99; // « La Boulette » ≈ 99 BPM (estimation de timeline.json)
          const TITLE_OUT = 2.4;
          const FIRST_SLOT_IN = 2.1;
          const ACCEL_AT = 100.5; // SFX_ADO_ACCEL
          const SCRATCH_AT = 103.9; // SFX_ADO_RECORD_SCRATCH : arrêt net
          const CUT_AT = 104.35;
          const SHAKE_STEP = 0.06;
          const ACCENTS = ["#ff2bd6", "#00f0ff", "#e4ff1a", "#7b2bff", "#2d5bff"];
          const COLLAGE_ROT = [-6, 3, -2];

          function enter(tl, slot, style, at) {
            switch (style) {
              case "whip_pan_neon":
                tl.fromTo(slot, { opacity: 0, x: 1800, skewX: -22, filter: "blur(22px)" }, { opacity: 1, x: 0, skewX: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, at);
                break;
              case "flash_stroboscopique_leger": // un seul éclair, bien sous le seuil de 3 flashs/s
                tl.fromTo(slot, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, at);
                tl.fromTo("#ado-flash", { opacity: 0.8 }, { opacity: 0, duration: 0.18, ease: "power1.out", immediateRender: false }, at);
                break;
              case "demi_teinte_pop_art":
                tl.fromTo(slot, { opacity: 0, clipPath: "circle(0% at 50% 50%)" }, { opacity: 1, clipPath: "circle(80% at 50% 50%)", duration: 0.6, ease: "power3.out" }, at);
                break;
              case "datamosh_vhs":
                tl.fromTo(slot, { opacity: 0, scaleY: 0.04, skewX: 30, filter: "hue-rotate(120deg)" }, { opacity: 1, scaleY: 1, skewX: 0, filter: "hue-rotate(0deg)", duration: 0.5, ease: "expo.out" }, at);
                break;
              case "tag_graffiti_wipe":
                tl.fromTo(slot, { opacity: 0, clipPath: "inset(0% 100% 0% 0%)", rotation: -3 }, { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", rotation: 0, duration: 0.6, ease: "power2.out" }, at);
                break;
              default: // glitch_rgb, record_scratch_glitch
                tl.fromTo(slot, { opacity: 0, x: -40, scale: style === "record_scratch_glitch" ? 1.2 : 1, filter: "blur(8px)" }, { opacity: 1, x: 0, scale: 1, filter: "blur(0px)", duration: 0.4, ease: "steps(6)" }, at);
            }
          }

          function build() {
            const tl = gsap.timeline({ paused: true });
            const slots = Array.from(document.querySelectorAll("#ado .slot"));
            document.getElementById("ado-count-total").textContent = String(slots.length).padStart(2, "0");

            // ---------------------------------------------------------------- fond : aplats qui défilent
            tl.fromTo("#ado-marquee", { x: 0 }, { x: -3200, duration: DUR, ease: "none" }, 0);
            tl.fromTo("#ado-bar-1", { x: -300, rotation: -14 }, { x: 300, rotation: -11, duration: DUR, ease: "none" }, 0);
            tl.fromTo("#ado-bar-2", { x: 200, rotation: -14 }, { x: -500, rotation: -16, duration: DUR, ease: "none" }, 0);
            tl.fromTo("#ado-bar-3", { x: -100, rotation: -14 }, { x: 600, rotation: -12, duration: DUR, ease: "none" }, 0);

            // ---------------------------------------------------------------- titre
            tl.fromTo("#ado-title-num", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.05);
            tl.fromTo("#ado-title-main", { opacity: 0, scale: 1.4, x: -30 }, { opacity: 1, scale: 1, x: 0, duration: 0.5, ease: "steps(5)" }, 0.1);
            tl.to("#ado-title", { opacity: 0, scale: 1.15, duration: 0.25, ease: "power2.in" }, TITLE_OUT);
            tl.fromTo(["#ado-tag", "#ado-count"], { opacity: 0 }, { opacity: 1, duration: 0.3 }, TITLE_OUT + 0.4);
            tl.to(["#ado-tag", "#ado-count"], { opacity: 0, duration: 0.2 }, SCRATCH_AT);

            // ---------------------------------------------------------------- emplacements
            const counter = document.getElementById("ado-count-n");
            slots.forEach((slot, i) => {
              const accent = slot.dataset.accent || ACCENTS[i % ACCENTS.length];
              slot.style.setProperty("--slot-accent", accent);
              const at = Math.max(Number(slot.dataset.at), i === 0 ? FIRST_SLOT_IN : 0);
              const next = slots[i + 1];
              const out = next ? Number(next.dataset.at) : SCRATCH_AT;
              tl.set(counter, { textContent: String(i + 1).padStart(2, "0") }, at);
              tl.to("#ado-bar-2", { backgroundColor: accent, duration: 0.2 }, at);

              if (slot.dataset.kind === "collage") {
                tl.fromTo(slot, { opacity: 0 }, { opacity: 1, duration: 0.01 }, at);
                slot.querySelectorAll(".slot-media").forEach((m, k) => {
                  tl.fromTo(m, { opacity: 0, scale: 1.7, rotation: COLLAGE_ROT[k] * 3 }, { opacity: 1, scale: 1, rotation: COLLAGE_ROT[k], duration: 0.45, ease: "back.out(2)" }, at + 0.1 + k * 0.25);
                  tl.fromTo(m, { y: 0 }, { y: k % 2 ? -18 : 18, duration: out - at - 0.6, ease: "sine.inOut", immediateRender: false }, at + 0.6);
                });
              } else {
                enter(tl, slot, slot.dataset.tr || "glitch_rgb", at);
                // pulsation sur le tempo + lente poussée dans l'image
                const media = slot.querySelector(".slot-media");
                const beats = Math.max(1, Math.floor((out - at - 0.5) / BEAT));
                tl.fromTo(media, { scale: 1.035 }, { scale: 1, duration: BEAT * 0.5, ease: "power2.out", repeat: beats - 1, repeatDelay: BEAT * 0.5, immediateRender: false }, at + 0.5);
                tl.fromTo(slot.querySelector(".m-kb"), { scale: 1 }, { scale: 1.08, duration: out - at, ease: "none" }, at);
              }

              // texte street art (ex. « OMG »)
              if (slot.dataset.text) {
                const tag = document.createElement("div");
                tag.className = "ado-street";
                tag.setAttribute("data-layout-allow-overlap", "");
                tag.textContent = slot.dataset.text;
                slot.appendChild(tag);
                tl.fromTo(tag, { opacity: 0, scale: 1.6, rotation: -9, filter: "blur(12px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.35, ease: "power3.out" }, at + 0.4);
                tl.to(tag, { opacity: 0, duration: 0.25 }, at + 2.4);
              }

              // sortie : le suivant chasse le précédent
              if (next) {
                const whip = next.dataset.tr === "whip_pan_neon";
                tl.to(slot, whip ? { x: -1800, skewX: 18, opacity: 0, duration: 0.4, ease: "expo.in" } : { opacity: 0, duration: 0.2 }, out - (whip ? 0.12 : 0));
              }
            });

            // ---------------------------------------------------------------- final : accélération puis arrêt net (scratch)
            const last = slots[slots.length - 1];
            tl.fromTo(last, { rotation: -0.6 }, { rotation: 0.6, duration: SHAKE_STEP, ease: "none", yoyo: true, repeat: Math.floor((SCRATCH_AT - ACCEL_AT) / SHAKE_STEP) - 1, immediateRender: false }, ACCEL_AT);
            tl.fromTo(last, { scale: 1 }, { scale: 1.12, duration: SCRATCH_AT - ACCEL_AT, ease: "power2.in", immediateRender: false }, ACCEL_AT);
            tl.fromTo("#ado-fx", { filter: "invert(0)" }, { filter: "invert(1)", duration: 0.05 }, SCRATCH_AT);
            tl.to("#ado-fx", { filter: "invert(0)", duration: 0.05 }, SCRATCH_AT + 0.2);
            tl.fromTo("#ado-cut", { opacity: 0 }, { opacity: 1, duration: 0.15 }, CUT_AT);

            window.__timelines[ID] = tl;
          }

          document.fonts.ready.then(build);
        })();
      </script>
    </template>
  </body>
</html>
